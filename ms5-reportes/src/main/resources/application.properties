server.port=${SERVER_PORT:8086}
spring.application.name=ms5-reportes
spring.jackson.serialization.write-bigdecimal-as-plain=true
spring.jackson.deserialization.use-big-decimal-for-floats=false

# BD REPORTES — H2 en modo archivo (persistente via volumen Docker)
spring.datasource.url=jdbc:h2:file:/data/bd-reportes;DB_CLOSE_DELAY=-1;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
