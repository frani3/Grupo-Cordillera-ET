events {
    worker_connections 1024;
}

http {
    # Resolver DNS interno de Docker — re-resuelve hostnames cada 10s
    # Evita que nginx quede con la IP cacheada de un contenedor recreado
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;
        server_name localhost;

        # Variables de upstream: fuerzan re-resolucion DNS en cada uso
        set $bff      "http://bff-service:8080";
        set $ms_auth  "http://ms-auth:8090";

        # Health del gateway (responde siempre, sin upstream)
        location = /health {
            default_type application/json;
            return 200 '{"status":"UP","service":"api-gateway","port":80}';
        }

        # Rutas de autenticacion -> MS AUTH
        location /auth/ {
            proxy_pass         $ms_auth/auth/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
        }

        # Todo lo demas -> BFF
        location / {
            proxy_pass         $bff;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }
}
