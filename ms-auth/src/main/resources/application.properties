server.port=${SERVER_PORT:8090}
spring.application.name=ms-auth

# BD USUARIO — H2 en modo archivo (persistente via volumen Docker)
spring.datasource.url=jdbc:h2:file:/data/bd-usuario;DB_CLOSE_DELAY=-1;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
# Desactiva el procesamiento de data.sql; el seed se hace via CommandLineRunner
spring.sql.init.mode=never
