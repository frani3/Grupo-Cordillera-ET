version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# Red interna — todos los servicios se comunican por nombre de contenedor
# ─────────────────────────────────────────────────────────────────────────────
networks:
  cordillera-net:
    driver: bridge

services:
  # ── ms1-pos ─────────────────────────────────────────────────────────────────
  # Patrón: Singleton (CopyOnWriteArrayList en memoria)
  # Puerto interno: 8081

  ms1-pos:
    build:
      context: ./ms1-pos
      dockerfile: Dockerfile
    container_name: ms1-pos-app
    networks:
      - cordillera-net
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
    restart: on-failure

  # ── orq-service ─────────────────────────────────────────────────────────────
  # Patrón: Strategy (algoritmos de procesamiento intercambiables)
  # Puerto interno: 8080  →  host: 8082

  # ── ms2-online ──────────────────────────────────────────────────────────────
  # Patron: Singleton (in-memory store de ventas online)
  # Puerto interno: 8083  ->  host: 8083

  ms2-online:
    build:
      context: ./ms2-online
      dockerfile: Dockerfile
    container_name: ms2-online-app
    networks:
      - cordillera-net
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
    restart: on-failure

  # ── orq-service ─────────────────────────────────────────────────────────────
  # Patron: Strategy (algoritmos de procesamiento intercambiables)
  # Puerto interno: 8080  ->  host: 8082

  orq-service:
    build:
      context: ./orq-service
      dockerfile: Dockerfile
    container_name: orq-service-app
    networks:
      - cordillera-net
    ports:
      - "8082:8080"
    environment:
      SERVER_PORT: 8080
      # URL del data-ms (MS1) y ms2-online — modelo PULL paralelo
      DATA_MS_URL: http://ms1-pos:8081
      DATA_MS2_URL: http://ms2-online:8083
    depends_on:
      - ms1-pos
      - ms2-online
    restart: on-failure

  # ── bff-service ─────────────────────────────────────────────────────────────
  # Patrón: Proxy (seguridad Bearer + auditoría + manejo de errores)
  # Puerto interno: 8080  →  host: 8080

  bff-service:
    build:
      context: ./bff-service
      dockerfile: Dockerfile
    container_name: bff-service-app
    networks:
      - cordillera-net
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      # URL del orq-service dentro de la red Docker
      ORQ_SERVICE_URL: http://orq-service:8080
    depends_on:
      - orq-service
    restart: on-failure

  # ── frontend-app ─────────────────────────────────────────────────────────────
  # Patrón: Factory Method (instancia clientes HTTP según entorno)
  # Puerto interno: 3000  →  host: 3000

  frontend-app:
    build:
      context: ./frontend-app
      dockerfile: Dockerfile
    container_name: frontend-app
    networks:
      - cordillera-net
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      # URL del bff-service dentro de la red Docker
      BFF_URL: http://bff-service:8080
    depends_on:
      - bff-service
    restart: on-failure
